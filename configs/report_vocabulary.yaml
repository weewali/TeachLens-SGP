# Plain-language names for the indicator IDs that the lagged analysis reports.
# The report and the language model only use these words, never the raw IDs.
# When the fusion layer adds an indicator, add it here; an ID missing from this file is left out of the report
# and listed under "not_interpreted", so nothing is described with guessed words.
#
# instructor_actions: phrase completes "When the instructor spent more time ..."
# instructor_events:  phrase completes "After the instructor ..." (actions that start at a moment; peri-event results)
# student_behaviours: phrase is what rose or fell; favourable_when_higher says whether a rise is good news
#                     (true / false), or null when it is neither: such links are counted but not turned into points.
# Behaviours are observable postures and objects, never attention, engagement, sleep or other inner states
# (tests/unit/test_lag_facts.py checks every phrase against the report's own word checks).
#
# Two sets of IDs:
# - The team's fusion layer (src/analysis/fusion.py FEATURES and scripts/fuse_lesson.py TEACHER_EVENTS, 2026-11-18):
#   T_*, S_* and the *_start events. Their good/bad-news direction must match FEATURES' "desirable"
#   (+1 true, -1 false, 0 null); a test and the report step both check this.
# - System B's own pipeline (main code/Main Code.py): explanation_ratio, phone_rate, ...

instructor_actions:
  # fusion layer
  T_facing_class:
    phrase: facing the class
  T_looking_at_students:
    phrase: with their head turned toward the students
  T_board_or_screen:
    phrase: at the board or screen
  T_writing:
    phrase: writing on the board
  T_pointing:
    phrase: pointing at something
  T_pointing_at_students:
    phrase: pointing toward the class
  T_gesturing:
    phrase: gesturing with their hands
  T_walking:
    phrase: walking
  T_stationary:
    phrase: standing still
  T_path:
    phrase: moving around the room
  # System B
  explanation_ratio:
    phrase: explaining to the class
  board_work_ratio:
    phrase: at the board facing it
  interaction_count:
    phrase: facing the class with a raised hand
  movement_amount:
    phrase: moving around
  teacher_stationary_ratio:
    phrase: standing still
  teacher_seated_ratio:
    phrase: seated
  teacher_gesture:
    phrase: gesturing
  instructor_present:
    phrase: in view of the camera

instructor_events:
  # fusion layer (scripts/fuse_lesson.py TEACHER_EVENTS)
  board_or_screen_start:
    phrase: went to the board or screen
  writing_start:
    phrase: started writing on the board
  pointing_start:
    phrase: started pointing at something
  pointing_at_students_start:
    phrase: pointed toward the class
  turn_to_class:
    phrase: turned to face the class
  walking_start:
    phrase: started walking
  raised_hand_start:
    phrase: raised a hand

student_behaviours:
  # fusion layer
  S_on_target:
    phrase: the share of students facing the front or a classmate who was answering
    favourable_when_higher: true
  S_off_target:
    phrase: the share of students facing away from the front and from any classmate who was answering
    favourable_when_higher: false
  S_looking_down:
    phrase: the share of students looking down
    favourable_when_higher: null      # notes, a phone and reading look the same from the camera
  S_phone:
    # phone_likely is a long head-down stretch with no phone seen (docs/list_c_students.md), so say so
    phrase: the share of students with a phone seen in hand or a long head-down stretch that may be phone use
    favourable_when_higher: false
  S_laptop:
    phrase: the share of students working at an open laptop
    favourable_when_higher: null
  S_writing:
    phrase: the share of students writing
    favourable_when_higher: true
  S_reading:
    phrase: the share of students reading
    favourable_when_higher: null
  S_talking:
    phrase: the share of students talking (mouth moving)
    favourable_when_higher: null
  S_smiling:
    phrase: the share of students smiling
    favourable_when_higher: null
  S_head_down:
    phrase: the share of students with their head down
    favourable_when_higher: false
  S_sleep:
    # alertness dozing / possible_sleep: head resting at or below the shoulders and still, or eyes closed for a while
    phrase: the share of students with their head resting low and still, or eyes closed for a while
    favourable_when_higher: false
  S_moving:
    phrase: the share of students moving noticeably
    favourable_when_higher: null
  S_hand_raises:
    phrase: the number of hand raises
    favourable_when_higher: true
  S_answers:
    phrase: the number of raised hands followed by the student speaking or standing up
    favourable_when_higher: true
  # System B
  attention_level:
    phrase: the share of students with their heads up
    favourable_when_higher: true
  off_task_rate:
    phrase: the share of students looking down for long stretches or with a phone
    favourable_when_higher: false
  hand_raise_count:
    phrase: the number of hand raises
    favourable_when_higher: true
  phone_rate:
    phrase: the share of students with a phone in view
    favourable_when_higher: false
  head_down_still_rate:
    phrase: the share of students with their head down and still
    favourable_when_higher: false

# Other wording for an analysis measured by another pipeline (its fusion report says "measured_by"). Only phrases may
# change here, never whether a rise is good news (the loader refuses anything else).
measured_by:
  # main code/Main Code.py maps its own rules onto the fusion layer's indicators (docs/main_code_events.md); some are
  # narrower than the team's, so they get words that say what was actually measured
  main_code:
    instructor_actions:
      T_board_or_screen:
        phrase: at the board facing it
      T_stationary:
        phrase: standing still in one spot
    instructor_events:
      board_or_screen_start:
        phrase: went to the board
    student_behaviours:
      S_on_target:
        phrase: the share of students with their heads up and facing the front
      S_off_target:
        phrase: the share of students with their heads up but turned away from the front
      S_phone:
        phrase: the share of students with a phone seen near them
      S_sleep:
        phrase: the share of students with their head down and still for half a minute or more
